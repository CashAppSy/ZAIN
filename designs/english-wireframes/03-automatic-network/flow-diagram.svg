<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1040" viewBox="0 0 800 1040"><rect width="800" height="1040" fill="white"/><text x="40" y="40" font-family="Arial, sans-serif" font-size="24" fill="#202b35">03 Automatic Network</text><text x="40" y="68" font-family="Arial, sans-serif" font-size="13" fill="#202b35">Read top to bottom. Conditional routes are explained in each step.</text><rect x="80" y="110" width="640" height="96" rx="8" fill="#f0f7f5" stroke="#a7b0b8"/><text x="104" y="146" font-family="Arial, sans-serif" font-size="20" fill="#202b35">Splash</text><text x="104" y="176" font-family="Arial, sans-serif" font-size="14" fill="#202b35">Check company mobile data connection</text><path d="M400 206 L400 238" stroke="#488f80" fill="none"/><path d="M400 238 L394 230" stroke="#488f80" fill="none"/><path d="M400 238 L406 230" stroke="#488f80" fill="none"/><rect x="80" y="248" width="640" height="96" rx="8" fill="#f0f7f5" stroke="#a7b0b8"/><text x="104" y="284" font-family="Arial, sans-serif" font-size="20" fill="#202b35">Secure subscriber identification</text><text x="104" y="314" font-family="Arial, sans-serif" font-size="14" fill="#202b35">Verify the subscriber identity</text><path d="M400 344 L400 376" stroke="#488f80" fill="none"/><path d="M400 376 L394 368" stroke="#488f80" fill="none"/><path d="M400 376 L406 368" stroke="#488f80" fill="none"/><rect x="80" y="386" width="640" height="96" rx="8" fill="#f0f7f5" stroke="#a7b0b8"/><text x="104" y="422" font-family="Arial, sans-serif" font-size="20" fill="#202b35">Verification successful?</text><text x="104" y="452" font-family="Arial, sans-serif" font-size="14" fill="#202b35">YES: bypass login and go to Home</text><path d="M400 482 L400 514" stroke="#488f80" fill="none"/><path d="M400 514 L394 506" stroke="#488f80" fill="none"/><path d="M400 514 L406 506" stroke="#488f80" fill="none"/><rect x="80" y="524" width="640" height="96" rx="8" fill="#f0f7f5" stroke="#a7b0b8"/><text x="104" y="560" font-family="Arial, sans-serif" font-size="20" fill="#202b35">Home</text><text x="104" y="590" font-family="Arial, sans-serif" font-size="14" fill="#202b35">Display current plan details</text><rect x="80" y="662" width="640" height="96" rx="8" fill="#f0f7f5" stroke="#a7b0b8"/><text x="104" y="698" font-family="Arial, sans-serif" font-size="20" fill="#202b35">Fallback: normal sign in</text><text x="104" y="728" font-family="Arial, sans-serif" font-size="14" fill="#202b35">NO: phone + SMS or Google login</text><path d="M720 434 L756 434" stroke="#c2cbd2" fill="none"/><path d="M756 434 L756 710" stroke="#c2cbd2" fill="none"/><path d="M756 710 L720 710" stroke="#c2cbd2" fill="none"/><text x="733" y="558" font-family="Arial, sans-serif" font-size="11" fill="#202b35">NO</text></svg>