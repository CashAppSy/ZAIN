<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1040" viewBox="0 0 800 1040"><rect width="800" height="1040" fill="white"/><text x="40" y="32" font-family="Arial, sans-serif" font-size="22" fill="#202b35">03 Google Handoff</text><text x="40" y="56" font-family="Arial, sans-serif" font-size="13" fill="#202b35">English wireframe | viewport 390 x 844 px | 1x logical pixels</text><rect x="40" y="100" width="390" height="844" rx="0" fill="#ffffff" stroke="#202b35"/><text x="64" y="128" font-family="Arial, sans-serif" font-size="12" fill="#202b35">9:41</text><text x="318" y="128" font-family="Arial, sans-serif" font-size="12" fill="#202b35">LTE   100%</text><text x="465" y="119" font-family="Arial, sans-serif" font-size="14" fill="#202b35">MEASUREMENTS</text><text x="465" y="140" font-family="Arial, sans-serif" font-size="11" fill="#202b35">x / y are relative to the viewport.</text><text x="465" y="159" font-family="Arial, sans-serif" font-size="11" fill="#202b35">24 px margins | 342 px content width</text><rect x="64" y="276" width="342" height="160" rx="8" fill="#f7f9fa" stroke="#a7b0b8"/><text x="76" y="361.0" font-family="Arial, sans-serif" font-size="20" fill="#202b35">Google authentication</text><path d="M406 356.0 L450 186" stroke="#c2cbd2" fill="none"/><text x="465" y="190" font-family="Arial, sans-serif" font-size="12" fill="#202b35">Provider handoff</text><text x="465" y="207" font-family="Arial, sans-serif" font-size="11" fill="#53616d">342 x 160 px | x=24, y=176</text><text x="80" y="363" font-family="Arial, sans-serif" font-size="14" fill="#202b35">Opens Google-managed authentication.</text><text x="80" y="391" font-family="Arial, sans-serif" font-size="14" fill="#202b35">The provider controls its own screen.</text><rect x="64" y="476" width="342" height="48" rx="8" fill="#ffffff" stroke="#a7b0b8"/><text x="76" y="505.0" font-family="Arial, sans-serif" font-size="15" fill="#202b35">Return to sign in</text><path d="M406 500.0 L450 238" stroke="#c2cbd2" fill="none"/><text x="465" y="242" font-family="Arial, sans-serif" font-size="12" fill="#202b35">Cancel / return action</text><text x="465" y="259" font-family="Arial, sans-serif" font-size="11" fill="#53616d">342 x 48 px | x=24, y=376</text><text x="465" y="294" font-family="Arial, sans-serif" font-size="11" fill="#202b35">Flow placeholder, not a Google UI design.</text><text x="40" y="979" font-family="Arial, sans-serif" font-size="12" fill="#202b35">Success: linked number -&gt; Home; unlinked number -&gt; Link number.</text><text x="40" y="1002" font-family="Arial, sans-serif" font-size="12" fill="#202b35">Type: heading 22 px / body 14-16 px. Buttons: 48 px high. Radius: 8 px.</text></svg>