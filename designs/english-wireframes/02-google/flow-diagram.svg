<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1040" viewBox="0 0 800 1040"><rect width="800" height="1040" fill="white"/><text x="40" y="40" font-family="Arial, sans-serif" font-size="24" fill="#202b35">02 Google</text><text x="40" y="68" font-family="Arial, sans-serif" font-size="13" fill="#202b35">Read top to bottom. Conditional routes are explained in each step.</text><rect x="80" y="110" width="640" height="96" rx="8" fill="#f0f7f5" stroke="#a7b0b8"/><text x="104" y="146" font-family="Arial, sans-serif" font-size="20" fill="#202b35">Splash</text><text x="104" y="176" font-family="Arial, sans-serif" font-size="14" fill="#202b35">App startup</text><path d="M400 206 L400 238" stroke="#488f80" fill="none"/><path d="M400 238 L394 230" stroke="#488f80" fill="none"/><path d="M400 238 L406 230" stroke="#488f80" fill="none"/><rect x="80" y="248" width="640" height="96" rx="8" fill="#f0f7f5" stroke="#a7b0b8"/><text x="104" y="284" font-family="Arial, sans-serif" font-size="20" fill="#202b35">Sign in</text><text x="104" y="314" font-family="Arial, sans-serif" font-size="14" fill="#202b35">Choose Continue with Google</text><path d="M400 344 L400 376" stroke="#488f80" fill="none"/><path d="M400 376 L394 368" stroke="#488f80" fill="none"/><path d="M400 376 L406 368" stroke="#488f80" fill="none"/><rect x="80" y="386" width="640" height="96" rx="8" fill="#f0f7f5" stroke="#a7b0b8"/><text x="104" y="422" font-family="Arial, sans-serif" font-size="20" fill="#202b35">Google authentication</text><text x="104" y="452" font-family="Arial, sans-serif" font-size="14" fill="#202b35">Provider-managed screen</text><path d="M400 482 L400 514" stroke="#488f80" fill="none"/><path d="M400 514 L394 506" stroke="#488f80" fill="none"/><path d="M400 514 L406 506" stroke="#488f80" fill="none"/><rect x="80" y="524" width="640" height="96" rx="8" fill="#f0f7f5" stroke="#a7b0b8"/><text x="104" y="560" font-family="Arial, sans-serif" font-size="20" fill="#202b35">Number already linked?</text><text x="104" y="590" font-family="Arial, sans-serif" font-size="14" fill="#202b35">YES: go directly to Home</text><path d="M400 620 L400 652" stroke="#488f80" fill="none"/><path d="M400 652 L394 644" stroke="#488f80" fill="none"/><path d="M400 652 L406 644" stroke="#488f80" fill="none"/><rect x="80" y="662" width="640" height="96" rx="8" fill="#f0f7f5" stroke="#a7b0b8"/><text x="104" y="698" font-family="Arial, sans-serif" font-size="20" fill="#202b35">Link number + SMS verification</text><text x="104" y="728" font-family="Arial, sans-serif" font-size="14" fill="#202b35">NO: verify the subscriber number first</text><path d="M400 758 L400 790" stroke="#488f80" fill="none"/><path d="M400 790 L394 782" stroke="#488f80" fill="none"/><path d="M400 790 L406 782" stroke="#488f80" fill="none"/><rect x="80" y="800" width="640" height="96" rx="8" fill="#f0f7f5" stroke="#a7b0b8"/><text x="104" y="836" font-family="Arial, sans-serif" font-size="20" fill="#202b35">Home</text><text x="104" y="866" font-family="Arial, sans-serif" font-size="14" fill="#202b35">Display current plan details</text></svg>