<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="2700" viewBox="0 0 1250 2700" overflow="hidden"><title>03 google handoff</title><svg x="0" y="0" width="1250" height="2700" viewBox="40 100 390 844" preserveAspectRatio="none" overflow="hidden"><ns0:rect xmlns:ns0="http://www.w3.org/2000/svg" width="800" height="1040" fill="white" /><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="40" y="32" font-family="Arial, sans-serif" font-size="22" fill="#202b35">03 Google Handoff</ns0:text><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="40" y="56" font-family="Arial, sans-serif" font-size="13" fill="#202b35">English wireframe | viewport 390 x 844 px | 1x logical pixels</ns0:text><ns0:rect xmlns:ns0="http://www.w3.org/2000/svg" x="40" y="100" width="390" height="844" rx="0" fill="#ffffff" stroke="#202b35" /><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="64" y="128" font-family="Arial, sans-serif" font-size="12" fill="#202b35">9:41</ns0:text><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="318" y="128" font-family="Arial, sans-serif" font-size="12" fill="#202b35">LTE   100%</ns0:text><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="465" y="119" font-family="Arial, sans-serif" font-size="14" fill="#202b35">MEASUREMENTS</ns0:text><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="465" y="140" font-family="Arial, sans-serif" font-size="11" fill="#202b35">x / y are relative to the viewport.</ns0:text><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="465" y="159" font-family="Arial, sans-serif" font-size="11" fill="#202b35">24 px margins | 342 px content width</ns0:text><ns0:rect xmlns:ns0="http://www.w3.org/2000/svg" x="64" y="276" width="342" height="160" rx="8" fill="#f7f9fa" stroke="#a7b0b8" /><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="76" y="361.0" font-family="Arial, sans-serif" font-size="20" fill="#202b35">Google authentication</ns0:text><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="465" y="190" font-family="Arial, sans-serif" font-size="12" fill="#202b35">Provider handoff</ns0:text><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="465" y="207" font-family="Arial, sans-serif" font-size="11" fill="#53616d">342 x 160 px | x=24, y=176</ns0:text><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="80" y="363" font-family="Arial, sans-serif" font-size="14" fill="#202b35">Opens Google-managed authentication.</ns0:text><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="80" y="391" font-family="Arial, sans-serif" font-size="14" fill="#202b35">The provider controls its own screen.</ns0:text><ns0:rect xmlns:ns0="http://www.w3.org/2000/svg" x="64" y="476" width="342" height="48" rx="8" fill="#ffffff" stroke="#a7b0b8" /><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="76" y="505.0" font-family="Arial, sans-serif" font-size="15" fill="#202b35">Return to sign in</ns0:text><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="465" y="242" font-family="Arial, sans-serif" font-size="12" fill="#202b35">Cancel / return action</ns0:text><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="465" y="259" font-family="Arial, sans-serif" font-size="11" fill="#53616d">342 x 48 px | x=24, y=376</ns0:text><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="465" y="294" font-family="Arial, sans-serif" font-size="11" fill="#202b35">Flow placeholder, not a Google UI design.</ns0:text><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="40" y="979" font-family="Arial, sans-serif" font-size="12" fill="#202b35">Success: linked number -&gt; Home; unlinked number -&gt; Link number.</ns0:text><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="40" y="1002" font-family="Arial, sans-serif" font-size="12" fill="#202b35">Type: heading 22 px / body 14-16 px. Buttons: 48 px high. Radius: 8 px.</ns0:text></svg></svg>